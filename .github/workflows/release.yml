name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # only release when the CI workflow that just finished succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: changeset publish creates and pushes git tags,
          # and changelog-github links changesets to commits
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter astro-substack build

      - name: Unit tests (release gate)
        run: pnpm test:unit

      # No pending changesets  ->  `changeset publish` publishes every changed
      #                          version to npm and tags the release.
      # Pending changesets     ->  opens/updates a "Version Packages" PR instead;
      #                          merging that PR lands back here and publishes.
      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # changesets 2.31.x masks pnpm publish errors behind
      # "TypeError: Cannot read properties of undefined (reading 'includes')";
      # the fallback publishes directly and surfaces the real registry error.
      - uses: changesets/action@v1
        with:
          publish: pnpm run publish:npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish from either path above must end up on npm before a release is
      # cut; the tag may already exist (changeset publish pushes it) or is
      # created here when the fallback path published.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/astro-substack/package.json').version")
          TAG="astro-substack@${VERSION}"
          if npm view "astro-substack@${VERSION}" version >/dev/null 2>&1; then
            git tag "${TAG}" 2>/dev/null || true
            git push origin "${TAG}" 2>/dev/null || true
            sed -n "/^## ${VERSION}\$/,/^## /p" packages/astro-substack/CHANGELOG.md | sed '1d;$d' > release-notes.md
            gh release create "${TAG}" --title "astro-substack v${VERSION}" --notes-file release-notes.md \
              || gh release edit "${TAG}" --notes-file release-notes.md
          else
            echo "astro-substack@${VERSION} not on npm; nothing to release this run."
          fi
