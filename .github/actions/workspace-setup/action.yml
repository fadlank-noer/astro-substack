name: "Workspace setup"
description: >-
  Checkout + pnpm + Node 22 + frozen install for this pnpm monorepo — the
  shared "checkout" component every pipeline stage starts with.

inputs:
  fetch-depth:
    description: "Git fetch depth (npm release needs full history for tags)"
    required: false
    default: "1"
  registry-url:
    description: "npm registry to authenticate against (empty = none)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
