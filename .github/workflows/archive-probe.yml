# One-off diagnostic: find a Substack fetch path that works from a GitHub
# Actions runner (datacenter IP). The archive endpoint is behind Cloudflare,
# which 403-challenges datacenter requests regardless of User-Agent (verified
# 2026-09-30, run 36668783878). This probe also tries the RSS /feed, which RSS
# readers must be able to fetch bot-wise, plus header variants.
# Push to the ci/archive-probe branch to run it; safe to delete afterwards.
name: Substack archive probe

on:
  push:
    branches: [ci/archive-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe fetch paths from runner IP
        run: |
          node --input-type=module <<'EOF'
          const base = "https://fadlansthought.substack.com";
          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36";

          // Every attempt is informational; the gate is "at least one path
          // that a CI prebuild could use returns 200".
          const attempts = [
            ["archive + Accept only", `${base}/api/v1/archive?sort=new&offset=0&limit=10`, { Accept: "application/json" }],
            ["archive + browser UA", `${base}/api/v1/archive?sort=new&offset=0&limit=10`, { Accept: "application/json", "User-Agent": UA }],
            ["feed + Accept only", `${base}/feed`, { Accept: "application/rss+xml, application/xml, text/xml, */*" }],
            ["feed + browser UA", `${base}/feed`, { Accept: "application/rss+xml, application/xml, text/xml, */*", "User-Agent": UA }],
          ];

          let anyOk = false;
          for (const [label, url, headers] of attempts) {
            try {
              const res = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
              const text = res.ok ? await res.text() : "";
              const extra = res.ok
                ? url.endsWith("/feed") ? ` — ${Number(text.match(/<item>/g)?.length ?? 0)} <item> entries` : " — JSON array"
                : ` — ${text.slice(0, 100).replace(/\s+/g, " ")}`;
              console.log(`${res.status} ${res.statusText}${extra}  <- ${label}`);
              if (res.ok) anyOk = true;
            } catch (cause) {
              console.log(`network error: ${cause.message}  <- ${label}`);
            }
          }

          if (!anyOk) {
            console.error("FAIL: no fetch path succeeded from this runner.");
            process.exit(1);
          }
          console.log("PASS: at least one path works from the GitHub Actions runner.");
          EOF
