name: "Workspace setup"
description: >-
  pnpm + Node 22 + frozen install for this pnpm monorepo. Run actions/checkout
  BEFORE this component — local composite actions are resolved from the
  working directory, so the component itself cannot contain the checkout.

inputs:
  registry-url:
    description: "npm registry to authenticate against (empty = none)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
