# End-to-end static test on real infrastructure: deploys the bundled archive
# proxy Worker, proves the Substack archive is reachable THROUGH it from a
# GitHub Actions runner (direct fetches are 403-challenged there, see
# archive-probe.yml), builds examples/static through the proxy, and deploys
# the result to Cloudflare Pages as the astro-substack-static project.
#
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
# Cloudflare Pages:Edit), CLOUDFLARE_ACCOUNT_ID.
#
# Push to ci/archive-probe to run; safe to delete afterwards.
name: Static deploy test (Cloudflare)

on:
  push:
    branches: [ci/archive-probe]
  workflow_dispatch:

jobs:
  static-deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy archive proxy Worker
        working-directory: examples/worker-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 deploy 2>&1 | tee wrangler-deploy.log
          PROXY_URL=$(grep -oE 'https://astro-substack-archive-proxy\.[a-z0-9-]+\.workers\.dev' wrangler-deploy.log | head -1 || true)
          if [ -z "$PROXY_URL" ]; then
            echo "::error::Could not parse the workers.dev URL from wrangler output"
            exit 1
          fi
          echo "PROXY_URL=$PROXY_URL" >> "$GITHUB_ENV"

      - name: Smoke-test proxy from runner (archive through Worker)
        run: |
          ENCODED=$(node -e 'console.log(encodeURIComponent("https://fadlansthought.substack.com/api/v1/archive?sort=new&offset=0&limit=10"))')
          curl -fsS --max-time 30 "$PROXY_URL?url=$ENCODED" -o posts-smoke.json
          node -e 'const d=require("./posts-smoke.json"); if(!Array.isArray(d)||d.length===0) throw new Error("unexpected payload"); console.log("proxy OK:", d.length, "posts through", process.env.PROXY_URL)'
          rm posts-smoke.json

      - name: Build static example (prebuild fetches through the proxy)
        env:
          SUBSTACK_PUBLICATION_URL: https://fadlansthought.substack.com/
          SUBSTACK_LIMIT: "10"
          SUBSTACK_SORT: new
          SUBSTACK_PROXY_URL: ${{ env.PROXY_URL }}
        run: pnpm --filter static-example build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages project create astro-substack-static --production-branch=main || true

      - name: Deploy static example to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch=main is explicit: this workflow runs on ci/archive-probe, and
        # without it wrangler would infer the git branch and cut a preview
        # deployment instead of filling the production astro-substack-static.pages.dev.
        run: npx wrangler@4 pages deploy examples/static/dist --project-name=astro-substack-static --branch=main

      - name: Verify production URL is live
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://astro-substack-static.pages.dev || true)
            echo "attempt $i: astro-substack-static.pages.dev -> $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "PASS: https://astro-substack-static.pages.dev is live"
              exit 0
            fi
            sleep 10
          done
          echo "::error::astro-substack-static.pages.dev did not return 200"
          exit 1
