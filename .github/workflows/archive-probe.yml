# One-off diagnostic: prove the archive-403 fix from a real GitHub Actions
# runner (datacenter IP — the environment where the 403 was observed).
# Probes /api/v1/archive with the pre-fix header set and the patched browser
# User-Agent, then runs the live test through the actual client source.
# Push to the ci/archive-probe branch to run it; safe to delete afterwards.
name: Substack archive probe

on:
  push:
    branches: [ci/archive-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe archive endpoint from runner IP
        run: |
          node --input-type=module <<'EOF'
          const url = "https://fadlansthought.substack.com/api/v1/archive?sort=new&offset=0&limit=10";

          // Must match BROWSER_USER_AGENT in lib/substack/index.ts.
          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36";

          // Gate is only the patched path: the pre-fix attempt is informational
          // (Cloudflare rules may let it through sometimes — that is not a
          // failure of this probe).
          const attempts = [
            ["pre-fix headers (Accept only)", { Accept: "application/json" }, false],
            ["patched headers (browser User-Agent)", { Accept: "application/json", "User-Agent": UA }, true],
          ];

          let patchedOk = false;
          for (const [label, headers, isGate] of attempts) {
            try {
              const res = await fetch(url, { headers, signal: AbortSignal.timeout(15000) });
              const body = res.ok ? "" : ` — ${(await res.text()).slice(0, 120).replace(/\s+/g, " ")}`;
              console.log(`${res.status} ${res.statusText}${body}  <- ${label}`);
              if (isGate && res.ok) patchedOk = true;
            } catch (cause) {
              console.log(`network error: ${cause.message}  <- ${label}`);
            }
          }

          if (!patchedOk) {
            console.error("FAIL: patched browser-UA request did not succeed from this runner.");
            process.exit(1);
          }
          console.log("PASS: browser User-Agent fetch succeeded from the GitHub Actions runner.");
          EOF

      - name: Live test through the patched client
        working-directory: packages/astro-substack
        env:
          SUBSTACK_LIVE_TEST: "1"
        run: node --test tests/substack-live.test.ts
