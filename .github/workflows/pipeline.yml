# One pipeline, component stages. Every stage reuses the composite actions in
# .github/actions/: checkout/setup → build-feed-example → build-static-example
# → deploy-feed-example, ending in the npm release.
#
# Stage order: checkout+CI → test feed → test static with shared proxy → deploy npm.
# The feed example's Cloudflare deploy runs on main only, folded into its test
# stage (that stage IS the former feed-example-deploy.yml).
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pipeline-${{ github.ref }}
  # cancel superseded runs on PRs, but never kill a release mid-publish on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: "Step 1 — Checkout + CI (test + build)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/workspace-setup

      - name: Build package
        run: pnpm --filter astro-substack build

      - name: Unit tests (includes real-install smoke test)
        run: pnpm test:unit

  feed:
    name: "Step 2 — Test feed example"
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: ./.github/actions/workspace-setup

      # Building the example IS the test: the astro build fetches the RSS feed
      # end-to-end through the shared public proxy (runner IPs are datacenter
      # IPs, which Substack's Cloudflare 403-challenges on direct requests).
      - uses: ./.github/actions/build-feed-example
        with:
          proxy-url: https://astro-substack-proxy.fadlank.web.id

      # Former feed-example-deploy.yml: publish the freshly built site to
      # Cloudflare on main; PRs only test the build.
      - name: Deploy feed example to Cloudflare (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/deploy-feed-example
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  static:
    name: "Step 3 — Test static example (shared proxy)"
    needs: feed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: ./.github/actions/workspace-setup

      # The prebuild fetches posts through the shared public proxy, then astro
      # builds the static site from __substack_rendered/posts.json.
      - uses: ./.github/actions/build-static-example
        with:
          proxy-url: https://astro-substack-proxy.fadlank.web.id
          publication-url: https://fadlansthought.substack.com/

  release:
    name: "Step 4 — Deploy npm (publish + GitHub Release)"
    needs: [ci, feed, static]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: ./.github/actions/workspace-setup
        with:
          # full history: changeset publish creates and pushes git tags,
          # and changelog-github links changesets to commits
          fetch-depth: "0"
          registry-url: "https://registry.npmjs.org"

      - name: Build package
        run: pnpm --filter astro-substack build

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pending changesets  ->  opens/updates a "Version Packages" PR instead of publishing.
      # No pending changesets ->  publishes every changed version to npm and pushes tags.
      # changesets 2.31.x masks pnpm publish errors behind
      # "TypeError: Cannot read properties of undefined (reading 'includes')";
      # the fallback publishes directly and surfaces the real registry error.
      - uses: changesets/action@v1
        with:
          publish: pnpm run publish:npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish from either path above must end up on npm before a release is
      # cut; the tag may already exist (changeset publish pushes it) or is
      # created here when the fallback path published.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/astro-substack/package.json').version")
          TAG="astro-substack@${VERSION}"
          if npm view "astro-substack@${VERSION}" version >/dev/null 2>&1; then
            git tag "${TAG}" 2>/dev/null || true
            git push origin "${TAG}" 2>/dev/null || true
            sed -n "/^## ${VERSION}\$/,/^## /p" packages/astro-substack/CHANGELOG.md | sed '1d;$d' > release-notes.md
            gh release create "${TAG}" --title "astro-substack v${VERSION}" --notes-file release-notes.md \
              || gh release edit "${TAG}" --notes-file release-notes.md
          else
            echo "astro-substack@${VERSION} not on npm; nothing to release this run."
          fi
